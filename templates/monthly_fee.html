<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monthly Fee | Student ERP</title>
  <link rel="stylesheet" href="/static/react/app.css">
</head>
<body>
  <div id="root"></div>
  <script>
    window.__ERP_PAGE__ = {
      name: "monthly-fee",
      title: "Monthly Fee",
      props: {
        error: {{ error|default(None)|tojson }},
        months: {{ months|tojson }},
        student: {
          id: {{ student.id|tojson }},
          name: {{ student.name|tojson }},
          total_fee: {{ student.total_fee|tojson }},
          paid_fee: {{ student.paid_fee|tojson }}
        },
        payments: [
          {% for p in payments %}
          {
            id: {{ p.id|tojson }},
            amount: {{ p.amount|tojson }},
            month: {{ p.month|tojson }},
            pay_date: {{ p.pay_date|tojson }}
          }{% if not loop.last %},{% endif %}
          {% endfor %}
        ]
      }
    };
  </script>
  <script type="module" src="/static/react/app.js"></script>
</body>
</html>
