<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monthly Fee Receipt | Student ERP</title>
  <link rel="stylesheet" href="/static/react/app.css">
</head>
<body>
  <div id="root"></div>
  <script>
    window.__ERP_PAGE__ = {
      name: "monthly-receipt",
      title: "Monthly Fee Receipt",
      props: {
        type: "monthly",
        payment: {
          id: {{ payment.id|tojson }},
          name: {{ payment.name|tojson }},
          class_name: {{ payment.class_name|tojson }},
          roll: {{ payment.roll|tojson }},
          month: {{ payment.month|tojson }},
          amount: {{ payment.amount|tojson }},
          pay_date: {{ payment.pay_date|tojson }}
        }
      }
    };
  </script>
  <script type="module" src="/static/react/app.js"></script>
</body>
</html>
