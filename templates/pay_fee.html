<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pay Fee | Student ERP</title>
  <link rel="stylesheet" href="/static/react/app.css">
</head>
<body>
  <div id="root"></div>
  <script>
    window.__ERP_PAGE__ = {
      name: "pay-fee",
      title: "Fees",
      props: {
        error: {{ error|default(None)|tojson }},
        remaining: {{ remaining|tojson }},
        student: {
          id: {{ student.id|tojson }},
          name: {{ student.name|tojson }},
          total_fee: {{ student.total_fee|tojson }},
          paid_fee: {{ student.paid_fee|tojson }}
        }
      }
    };
  </script>
  <script type="module" src="/static/react/app.js"></script>
</body>
</html>
