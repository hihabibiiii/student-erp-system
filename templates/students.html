<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Students | Student ERP</title>
  <link rel="stylesheet" href="/static/react/app.css">
</head>
<body>
  <div id="root"></div>
  <script>
    window.__ERP_PAGE__ = {
      name: "students",
      title: "Student Management",
      props: {
        classes: {{ classes|tojson }},
        selectedClass: {{ selected_class|default("all")|tojson }},
        students: [
          {% for s in students %}
          {
            id: {{ s.id|tojson }},
            name: {{ s.name|tojson }},
            roll: {{ s.roll|tojson }},
            class_name: {{ s.class_name|tojson }},
            phone: {{ s.phone|tojson }},
            total_fee: {{ s.total_fee|tojson }},
            paid_fee: {{ s.paid_fee|tojson }}
          }{% if not loop.last %},{% endif %}
          {% endfor %}
        ]
      }
    };
  </script>
  <script type="module" src="/static/react/app.js"></script>
</body>
</html>
